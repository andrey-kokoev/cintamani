[package]
name = "cintamani-kerr-capacity"
version = "0.1.0"
edition = "2024"
description = "Resource-explicit Kerr microresonator simulator and information-capacity estimator"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
num-complex = "0.4"
rand = { version = "0.9", features = ["std_rng"] }
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
approx = "0.5"
