[package]
name = "cintamani"
version = "0.1.0"
edition = "2024"
description = "Falsification harness for recurrent volumetric photonic computing"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
burn = { version = "0.21", features = ["autodiff", "dataset", "flex", "network", "store", "vision", "wgpu"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = { version = "0.9", features = ["std_rng"] }
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
approx = "0.5"
