[package]
name = "cintamani-domain"
version = "0.1.0"
edition = "2024"
description = "Rebuildable Site-owned categorical search registry for Cintamani"
license = "Apache-2.0"
default-run = "cintamani-domain"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
